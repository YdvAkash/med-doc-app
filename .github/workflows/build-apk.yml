name: Build and Release APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for push-back

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Update API URL to Production IP
        run: |
          sed -i "s|192.168.29.251|${{ secrets.PRODUCTION_IP }}|g" src/services/api.ts

      - name: Create .env file for Expo
        run: |
          echo "EXPO_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" > .env

      - name: Create google-services.json
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          echo "$FIREBASE_JSON" > google-services.json

      - name: Generate Release Tag
        id: generate_tag
        run: |
          echo "TAG_NAME=v$(date +'%Y.%m.%d')-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Inject Version
        run: |
          echo "export const APP_VERSION = '${{ env.TAG_NAME }}';" > src/version.ts

      - name: Prebuild Expo project
        run: npx expo prebuild --clean

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease



      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README with Latest APK link
        run: |
          APK_LINK="https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/app-release.apk"
          DATE=$(date +'%Y-%m-%d')
          echo "| ${{ env.TAG_NAME }} | $DATE | [Download APK]($APK_LINK) |" >> README.md

      - name: Commit and Push README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: Update APK download list in README [skip ci]"
          file_pattern: "README.md"
